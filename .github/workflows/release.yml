name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing version tag (e.g., v6.0.1)'
        required: true
        type: string

concurrency:
  group: extension-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.VERSION }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and package extensions
        run: node scripts/release.js prepare

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-release
          path: wit-calendar-*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            wit-calendar-${{ env.VERSION }}.zip
            wit-calendar-${{ env.VERSION }}-firefox.zip
            wit-calendar-${{ env.VERSION }}-sources.zip
          generate_release_notes: true
      - name: Trigger website screenshots
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ env.VERSION }}
        run: |
          gh api --method POST \
            repos/WITCodingClub/calendar-website/dispatches \
            -f event_type=extension-release \
            -f "client_payload[tag]=$RELEASE_TAG"


  publish:
    name: Publish to ${{ matrix.store }}
    needs: build-and-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store: [chrome, firefox]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.VERSION }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-release

      - name: Publish Chrome extension
        if: matrix.store == 'chrome'
        env:
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID || vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: node scripts/release.js chrome

      - name: Publish Firefox extension
        if: matrix.store == 'firefox'
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: node scripts/release.js firefox
